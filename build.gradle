plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("src/generated/**/.cache")
}

repositories {
    maven { url = "https://cursemaven.com/" }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets {
    testMod {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    testModImplementation.extendsFrom implementation
    testModCompileOnly.extendsFrom compileOnly
    testModRuntimeOnly.extendsFrom runtimeOnly, localRuntime
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo(sourceSets.testMod)

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        spb_test {
            sourceSet(sourceSets.testMod)
        }
    }

    runs {
        client {
            client()
            loadedMods = [mods.spb]
        }

        server {
            server()
            programArgument '--nogui'
            loadedMods = [mods.spb]
        }

        testClient {
            client()
            sourceSet = sourceSets.testMod
            loadedMods = [mods.spb, mods.spb_test]
            gameDirectory = file('run-test-client')
        }

        testServer {
            server()
            sourceSet = sourceSets.testMod
            loadedMods = [mods.spb, mods.spb_test]
            gameDirectory = file('run-test-server')
            programArgument '--nogui'
        }

        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.testMod
            loadedMods = [mods.spb, mods.spb_test]
            gameDirectory = file('run-game-tests')
            programArguments.addAll '--tests', 'spb_test:*'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'spb_test'
        }

        data {
            clientData()
            loadedMods = [mods.spb]
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly "net.objecthunter:exp4j:0.4.8"
    implementation "curse.maven:jupiter-1072905:8569832"
    implementation "curse.maven:saturn-lib-1767455:9538254"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

def testModVersion = project.version.toString()
tasks.named('processTestModResources', ProcessResources) {
    inputs.property 'mod_version', testModVersion
    filesMatching('META-INF/neoforge.mods.toml') {
        expand mod_version: testModVersion
    }
}

def testModJar = tasks.register('testModJar', Jar) {
    description = 'Builds the independent SPB test mod, fixtures and example datapacks.'
    archiveClassifier = 'test-mod'
    from sourceSets.testMod.output
}
tasks.named('assemble') {
    dependsOn testModJar
}

def mainArchive = tasks.named('jar', Jar).flatMap { it.archiveFile }
def testArchive = testModJar.flatMap { it.archiveFile }
tasks.register('verifyTestModIsolation') {
    group = 'verification'
    description = 'Checks that test code and example datapacks only ship in the separate test-mod jar.'
    dependsOn tasks.named('jar'), testModJar
    inputs.files(mainArchive, testArchive)
    doLast {
        new java.util.zip.ZipFile(mainArchive.get().asFile).withCloseable { archive ->
            def forbidden = archive.entries().findAll { entry ->
                !entry.isDirectory() && (entry.name.startsWith('data/example/') || entry.name.startsWith('data/spb_test/') ||
                        entry.name.startsWith('fixtures/') || entry.name.contains('/testmod/') ||
                        entry.name.contains('/gametest/'))
            }
            if (!forbidden.isEmpty()) throw new GradleException("Test content leaked into the main jar: ${forbidden}")
            archive.entries().findAll { entry -> entry.name.startsWith('assets/spb/lang/') && entry.name.endsWith('.json') }.each { entry ->
                archive.getInputStream(entry).withCloseable { input ->
                    def language = new groovy.json.JsonSlurper().parse(input, 'UTF-8')
                    if (language.keySet().any { it.startsWith('spb.example.') || it.startsWith('spb.resource.example.') })
                        throw new GradleException("Example translations leaked into the main jar: ${entry.name}")
                }
            }
        }
        new java.util.zip.ZipFile(testArchive.get().asFile).withCloseable { archive ->
            ['META-INF/neoforge.mods.toml', 'com/iafenvoy/spb/testmod/StartingPointBuyTest.class',
             'fixtures/evaluations.json', 'fixtures/invalid/index.json', 'assets/spb/lang/en_us.json',
             'data/example/spb/plan/default.json', 'data/spb_test/spb/plan/linked.json'].each { required ->
                if (archive.getEntry(required) == null) throw new GradleException("Test mod is missing ${required}")
            }
        }
    }
}
tasks.named('check') {
    dependsOn tasks.named('verifyTestModIsolation')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
